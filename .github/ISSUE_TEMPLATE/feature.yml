name: 🚀 Feature
description: 새로운 기능 개발
labels: ["type: feature 🚀"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: 🔥 Priority
      options:
        - '🔥 High'
        - '⚡ Medium'
        - '🌱 Low'
      default: 1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 작업 내용
      description: 무엇을 / 왜 만드는지 자유롭게 작성하세요.
      value: |
        ## 무엇을
        -

        ## 왜
        -

        ## 참고
        -
    validations:
      required: true
