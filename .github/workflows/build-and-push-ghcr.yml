#
# 중요:
# deploy 저장소의 webhook/hooks.json이 이 이름을 정확히 비교합니다.
# 따라서 webhook 설정도 함께 변경하지 않는 한 이름을 바꾸면 안 됩니다.
name: Build & Push to GHCR

on:
  # develop 또는 main 브랜치에 commit이 push되면 이미지를 빌드하고
  # GHCR에 push합니다.
  #
  # 일반적으로 PR merge도 대상 브랜치에 push가 발생하는 방식이므로
  # develop/main merge 후 자동으로 배포 이미지가 생성됩니다.
  push:
    branches: ["develop", "main"]

  # develop 또는 main 브랜치를 대상으로 하는 PR에서는
  # Docker 이미지가 정상적으로 만들어지는지만 검증합니다.
  #
  # 아래 Build and push image 단계의 push 조건 때문에
  # PR에서는 GHCR에 이미지를 push하지 않습니다.
  pull_request:
    branches: ["develop", "main"]

  # GitHub Actions 화면에서 사용자가 직접 워크플로우를 실행할 수 있게 합니다.
  #
  # 수동 실행 시에도 develop 또는 main 브랜치를 선택해야 합니다.
  # 다른 브랜치를 선택하면 Prepare image tags 단계에서 의도적으로 실패합니다.
  workflow_dispatch:

# GitHub Actions가 발급하는 GITHUB_TOKEN의 권한입니다.
#
# contents: read
#   actions/checkout이 저장소 코드를 읽는 데 사용합니다.
#
# packages: write
#   develop/main 이미지와 태그를 GHCR에 push하는 데 사용합니다.
permissions:
  contents: read
  packages: write

# 동일한 브랜치에서 여러 이미지 빌드가 겹치는 상황을 제어합니다.
#
# 예:
# develop에 commit A가 push되어 빌드 중인데 commit B가 다시 push되면
# A의 빌드를 취소하고 B의 빌드를 계속합니다.
#
# 오래된 commit의 latest-develop 이미지가 더 늦게 push되는 상황을
# 줄이는 역할을 합니다.
concurrency:
  group: oss-front-image-${{ github.ref }}
  cancel-in-progress: true

# 전체 job에서 공통으로 사용하는 값입니다.
env:
  # 이미지를 저장할 container registry입니다.
  REGISTRY: ghcr.io

  # 최종 이미지 주소는 다음 형태가 됩니다.
  #
  # ghcr.io/jiu-jitsu-org/oss-front:<tag>
  IMAGE_NAME: jiu-jitsu-org/oss-front

  # 저장소 루트를 기준으로 한 Dockerfile 경로입니다.
  DOCKERFILE: ./oss-frontend/Dockerfile

  # Docker build context입니다.
  #
  # Dockerfile의 COPY 명령은 기본적으로 이 디렉터리 안에 있는 파일만
  # 참조할 수 있습니다.
  CONTEXT: ./oss-frontend

jobs:
  build-and-push:
    # GitHub가 제공하는 Ubuntu 24.04 ARM64 네이티브 러너를 사용합니다.
    #
    # 기존 ubuntu-latest는 x86_64 러너였기 때문에 linux/arm64 이미지를
    # 만들 때 QEMU CPU 에뮬레이션이 필요했습니다.
    #
    # ubuntu-24.04-arm은 실제 ARM64 CPU에서 job을 실행하므로
    # QEMU가 필요하지 않으며, 이번 SIGILL 발생 경로가 제거됩니다.
    runs-on: ubuntu-24.04-arm

    steps:
      # Dockerfile, package.json, package-lock.json과 프론트엔드 소스를
      # GitHub Actions runner 작업 디렉터리로 가져옵니다.
      - name: Checkout source
        uses: actions/checkout@v6

      # 현재 job이 정말 ARM64 네이티브 러너에서 실행되고 있는지 확인합니다.
      #
      # ubuntu-24.04-arm에서는 일반적으로 uname -m 결과가 aarch64입니다.
      # 향후 runner 설정이 실수로 x86_64로 변경되면 여기서 즉시 실패하여
      # QEMU 없는 x86 러너에서 arm64 빌드를 시도하는 것을 막습니다.
      - name: Verify native ARM64 runner
        shell: bash
        run: |
          RUNNER_ARCH="$(uname -m)"

          echo "Runner architecture: ${RUNNER_ARCH}"

          case "${RUNNER_ARCH}" in
            arm64|aarch64)
              echo "Native ARM64 runner confirmed."
              ;;
            *)
              echo "Expected an ARM64 runner, but got: ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac

      # Docker Buildx builder를 준비합니다.
      #
      # Buildx는 BuildKit 기반 빌드, GitHub Actions cache,
      # platform 지정, registry push 등을 담당합니다.
      #
      # 단일 ARM64 이미지라도 Buildx는 계속 필요합니다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GHCR에 이미지를 push하기 위한 로그인 단계입니다.
      #
      # PR에서는 이미지 build만 검증하고 push하지 않으므로
      # 로그인 단계도 실행하지 않습니다.
      #
      # develop/main push 또는 workflow_dispatch에서만 실행됩니다.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker 이미지에 부여할 태그 목록을 생성합니다.
      #
      # push 이벤트:
      #   GITHUB_BASE_REF는 비어 있으므로 GITHUB_REF_NAME을 사용합니다.
      #
      # PR 이벤트:
      #   GITHUB_BASE_REF에는 PR 대상 브랜치인 develop 또는 main이 들어갑니다.
      #
      # workflow_dispatch:
      #   사용자가 선택한 브랜치 이름을 GITHUB_REF_NAME에서 가져옵니다.
      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          # PR이면 대상 브랜치, 그 외에는 현재 브랜치를 사용합니다.
          CHANNEL="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"

          # Git commit SHA의 앞 12자리만 이미지 태그에 사용합니다.
          #
          # deploy-oss-front.sh도 workflow_run.head_sha 앞 12자리를 잘라
          # sha-<12자리> 태그를 pull하므로 이 형식을 변경하면 안 됩니다.
          SHORT_SHA="${GITHUB_SHA::12}"

          # 자동 배포를 허용하는 브랜치를 develop과 main으로 제한합니다.
          #
          # workflow_dispatch에서 다른 브랜치를 선택했을 때도
          # 임의의 배포 태그가 생성되지 않도록 차단합니다.
          case "${CHANNEL}" in
            develop|main)
              ;;
            *)
              echo "Unsupported branch: ${CHANNEL}" >&2
              exit 1
              ;;
          esac

          # docker/build-push-action에 전달할 여러 개의 태그를
          # multiline output으로 생성합니다.
          {
            echo "value<<EOF"

            # 브랜치별 최신 배포 태그입니다.
            #
            # develop:
            #   ghcr.io/jiu-jitsu-org/oss-front:latest-develop
            #
            # main:
            #   ghcr.io/jiu-jitsu-org/oss-front:latest-main
            echo "${REGISTRY}/${IMAGE_NAME}:latest-${CHANNEL}"

            # 특정 commit을 추적하고 rollback할 수 있는 태그입니다.
            #
            # webhook 자동 배포에서는 이 태그를 사용합니다.
            echo "${REGISTRY}/${IMAGE_NAME}:sha-${SHORT_SHA}"

            # GitHub Actions 실행 번호를 기준으로 한 추적 태그입니다.
            echo "${REGISTRY}/${IMAGE_NAME}:run-${CHANNEL}-${GITHUB_RUN_NUMBER}"

            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # Next.js 애플리케이션의 ARM64 Docker 이미지를 빌드합니다.
      #
      # pull_request:
      #   push=false
      #   이미지 빌드 성공 여부만 검증하고 GHCR에는 올리지 않습니다.
      #
      # push 또는 workflow_dispatch:
      #   push=true
      #   빌드 결과를 GHCR에 push합니다.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # Docker build context입니다.
          context: ${{ env.CONTEXT }}

          # 사용할 Dockerfile 경로입니다.
          file: ${{ env.DOCKERFILE }}

          # PR에서는 build만 수행하고 push하지 않습니다.
          push: ${{ github.event_name != 'pull_request' }}

          # 현재 배포 서버가 Apple M1 Mac mini의 Linux ARM64 Docker 엔진이므로
          # ARM64 이미지만 생성합니다.
          #
          # ubuntu-24.04-arm 러너에서 네이티브로 실행되기 때문에
          # QEMU 에뮬레이션이 사용되지 않습니다.
          platforms: linux/arm64

          # Prepare image tags 단계에서 만든 3개의 태그를 적용합니다.
          tags: ${{ steps.tags.outputs.value }}

          # OCI 표준 이미지 메타데이터입니다.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=oss-front

          # 이전 GitHub Actions 빌드 cache를 가져옵니다.
          #
          # package metadata나 변경되지 않은 Docker layer를 재사용하여
          # 반복 빌드 시간을 단축합니다.
          cache-from: type=gha

          # 이번 빌드 결과를 다음 GitHub Actions 실행이 사용할 수 있도록
          # GitHub Actions cache에 저장합니다.
          #
          # mode=max는 최종 이미지뿐 아니라 중간 stage cache도 최대한 저장합니다.
          cache-to: type=gha,mode=max
